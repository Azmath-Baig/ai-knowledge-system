[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-system"
version = "0.1.0"
description = "A small, source-citing search tool over an internal knowledge base."
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2", "flask>=3.0,<4"]

[project.scripts]
kb = "knowledge_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_system = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
